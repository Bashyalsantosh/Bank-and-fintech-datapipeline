version: '3.8'

services:
  api:
    build: .
    container_name: nepal_bank_risk_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:secure_password@db:5432/loan_risk_db
      - WEIGHT_DTI=0.40
      - WEIGHT_LTV=0.35
      - WEIGHT_P_INSTANCES=0.25
      - THRESHOLD_CRITICAL=0.75
      - THRESHOLD_WATCHLIST=0.45
    depends_on:
      - db
    networks:
      - risk_network

  db:
    image: postgres:15-alpine
    container_name: nepal_bank_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: loan_risk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - risk_network

volumes:
  postgres_data:

networks:
  risk_network:
    driver: bridge

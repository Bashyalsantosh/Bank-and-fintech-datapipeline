prometheus:
    image: prom/prometheus:latest
    container_name: nepal_bank_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - risk_network

  grafana:
    image: grafana/grafana:latest
    container_name: nepal_bank_grafana
    ports:
      - "3000:3000"
    restart: always
    networks:
      - risk_network
